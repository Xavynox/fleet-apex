name: Build FLEET APEX Geode Mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        default: 'AllSupported'
        type: choice
        options:
          - AllSupported
          - Android64
          - Android32
          - Win64
          - MacOS
          - iOS

jobs:
  build-android64:
    name: Build Android (arm64)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'AllSupported' || github.event.inputs.target == 'Android64' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Android arm64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Android64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-android64
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30

  build-android32:
    name: Build Android (arm32)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'AllSupported' || github.event.inputs.target == 'Android32'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Android arm32)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Android32

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-android32
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    if: github.event.inputs.target == 'AllSupported' || github.event.inputs.target == 'Win64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Windows x64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Win64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-win64
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30

  build-macos:
    name: Build macOS (x64)
    runs-on: macos-latest
    if: github.event.inputs.target == 'AllSupported' || github.event.inputs.target == 'MacOS'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (macOS)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: MacOS

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-macos
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: github.event.inputs.target == 'AllSupported' || github.event.inputs.target == 'iOS'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (iOS)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: iOS

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-ios
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30
