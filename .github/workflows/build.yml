name: Build FLEET APEX Geode Mod

on:
  push:
    branches: [main, master, build/v0.4-phase1-frame-timing]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        default: 'AllSupported'
        type: choice
        options:
          - AllSupported
          - Android64
          - Android32
          - Win64
          - MacOS
          - iOS

jobs:
  build-android64:
    name: Build Android (arm64)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'Android64' || github.event.inputs.target == 'AllSupported' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Android arm64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Android64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-android64
          path: ${{ steps.build_mod.outputs.build-output }}/*.geode
          retention-days: 30

  build-android32:
    name: Build Android (arm32)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'Android32' || github.event.inputs.target == 'AllSupported'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Android arm32)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Android32

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-android32
          path: ${{ steps.build_mod.outputs.build-output }}/*.geode
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    if: github.event.inputs.target == 'Win64' || github.event.inputs.target == 'AllSupported'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Windows x64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Win64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-win64
          path: ${{ steps.build_mod.outputs.build-output }}/*.geode
          retention-days: 30

  build-macos:
    name: Build macOS (x64)
    runs-on: macos-latest
    if: github.event.inputs.target == 'MacOS' || github.event.inputs.target == 'AllSupported'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (macOS)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: MacOS

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-macos
          path: ${{ steps.build_mod.outputs.build-output }}/*.geode
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: github.event.inputs.target == 'iOS'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (iOS)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: iOS

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.4-ios
          path: ${{ steps.build_mod.outputs.build-output }}/*.geode
          retention-days: 30

  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [build-android64, build-android32, build-windows, build-macos, build-ios]
    if: always()
    steps:
      - name: Check Telegram secrets
        id: secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Telegram secrets missing; notifications skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped notification
        if: steps.secrets.outputs.skip == 'true'
        run: echo "Telegram notification skipped because TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."

      - name: Send Telegram notification
        if: steps.secrets.outputs.skip != 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANDROID64_RESULT: ${{ needs.build-android64.result }}
          ANDROID32_RESULT: ${{ needs.build-android32.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
        run: |
          set +e
          requested="${{ github.event.inputs.target }}"
          if [ -z "$requested" ]; then requested="push"; fi

          is_requested() {
            case "$requested" in
              AllSupported|push) return 0 ;;
              "$1") return 0 ;;
              *) return 1 ;;
            esac
          }

          overall="SUCCESS"
          incomplete="false"
          for pair in "Android64:$ANDROID64_RESULT" "Android32:$ANDROID32_RESULT" "Win64:$WINDOWS_RESULT" "MacOS:$MACOS_RESULT" "iOS:$IOS_RESULT"; do
            platform="${pair%%:*}"
            result="${pair##*:}"
            if is_requested "$platform"; then
            if [ "$result" != "success" ]; then
              if [ "$result" = "skipped" ]; then incomplete="true"; else overall="FAILED"; fi
            fi
          else
            if [ "$result" = "success" ] || [ "$result" = "failure" ]; then
              overall="PARTIAL"
            fi
          fi
        done

        if [ "$overall" = "SUCCESS" ] && [ "$incomplete" = "true" ]; then
          overall="INCOMPLETE"
        fi

        artifacts=""
        [ "$ANDROID64_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.4-android64"$'\n'
        [ "$ANDROID32_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.4-android32"$'\n'
        [ "$WINDOWS_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.4-win64"$'\n'
        [ "$MACOS_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.4-macos"$'\n'
        [ "$IOS_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.4-ios"$'\n'
        [ -z "$artifacts" ] && artifacts="none"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          message="FLEET APEX CI: ${overall}"$'\n'"Commit: ${{ github.sha }}"$'\n'"Branch: ${{ github.ref_name }}"$'\n'"Android64: ${ANDROID64_RESULT}"$'\n'"Android32: ${ANDROID32_RESULT}"$'\n'"Win64: ${WINDOWS_RESULT}"$'\n'"MacOS: ${MACOS_RESULT}"$'\n'"iOS: ${IOS_RESULT}"$'\n'"Artifacts:"$'\n'"${artifacts}"$'\n'"Run: ${run_url}"

          response=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true")

          echo "Telegram API response: $response"
          echo "$response" | grep -q '"ok":true'
