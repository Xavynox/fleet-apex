name: Build FLEET APEX Geode Mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        default: 'Android64'
        type: choice
        options:
          - Android64
          - Windows64
          - Linux64
          - macOS64

jobs:
  build-android:
    name: Build Android (arm64)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'Android64' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Android arm64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Android64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.2-android-arm64
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    if: github.event.inputs.target == 'Windows64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Windows x64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Windows64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.2-windows-x64
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'Linux64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Linux x64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Linux64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.2-linux-x64
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30

  build-macos:
    name: Build macOS (x64)
    runs-on: macos-latest
    if: github.event.inputs.target == 'macOS64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (macOS x64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: macOS64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.build-output != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.2-macos-x64
          path: ${{ steps.build_mod.outputs.build-output }}
          retention-days: 30

  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux, build-macos]
    if: always()
    steps:
      - name: Check Telegram secrets
        id: secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Telegram secrets missing; notifications skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped notification
        if: steps.secrets.outputs.skip == 'true'
        run: echo "Telegram notification skipped because TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."

      - name: Send Telegram notification
        if: steps.secrets.outputs.skip != 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
        run: |
          set +e
          overall="SUCCESS"
          for r in "$ANDROID_RESULT" "$WINDOWS_RESULT" "$LINUX_RESULT" "$MACOS_RESULT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              overall="FAILED"
            fi
          done

          artifacts=""
          [ "$ANDROID_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.2-android-arm64"$'\n'
          [ "$WINDOWS_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.2-windows-x64"$'\n'
          [ "$LINUX_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.2-linux-x64"$'\n'
          [ "$MACOS_RESULT" = "success" ] && artifacts="${artifacts}- fleet-apex-v0.2-macos-x64"$'\n'
          [ -z "$artifacts" ] && artifacts="none"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          message="FLEET APEX CI: ${overall}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Android: ${ANDROID_RESULT}
          Windows: ${WINDOWS_RESULT}
          Linux: ${LINUX_RESULT}
          macOS: ${MACOS_RESULT}
          Artifacts:
          ${artifacts}
          Run: ${run_url}"

          response=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true")

          echo "Telegram API response: $response"
          echo "$response" | grep -q '"ok":true'
