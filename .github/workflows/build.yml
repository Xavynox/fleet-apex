name: Build FLEET APEX Geode Mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        default: 'Android64'
        type: choice
        options:
          - Android64
          - Windows64
          - Linux64
          - macOS64

jobs:
  build-android:
    name: Build Android (arm64)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'Android64' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Android arm64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Android64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.geode_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.2-android-arm64
          path: ${{ steps.build_mod.outputs.geode_file }}
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    if: github.event.inputs.target == 'Windows64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Windows x64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Windows64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.geode_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.2-windows-x64
          path: ${{ steps.build_mod.outputs.geode_file }}
          retention-days: 30

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'Linux64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (Linux x64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: Linux64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.geode_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.2-linux-x64
          path: ${{ steps.build_mod.outputs.geode_file }}
          retention-days: 30

  build-macos:
    name: Build macOS (x64)
    runs-on: macos-latest
    if: github.event.inputs.target == 'macOS64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FLEET APEX Geode Mod (macOS x64)
        id: build_mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./FLEET_APEX/geode-mod
          target: macOS64

      - name: Upload Geode mod artifact
        if: steps.build_mod.outputs.geode_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: fleet-apex-v0.2-macos-x64
          path: ${{ steps.build_mod.outputs.geode_file }}
          retention-days: 30
